<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>Snake 🐍</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      overflow: hidden;
      touch-action: none;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #0ff; }
    #score { font-size: 1.1rem; margin-bottom: 10px; color: #f0f; }
    canvas {
      background: #16213e;
      border: 2px solid #0ff;
      border-radius: 8px;
      display: block;
    }
    #controls {
      margin-top: 16px;
      display: grid;
      grid-template-areas:
        ". up ."
        "left down right";
      gap: 8px;
    }
    button {
      width: 56px; height: 56px;
      font-size: 1.5rem;
      background: #0f3460;
      color: #0ff;
      border: 2px solid #0ff;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { background: #0ff; color: #1a1a2e; }
    #btn-up    { grid-area: up; }
    #btn-down  { grid-area: down; }
    #btn-left  { grid-area: left; }
    #btn-right { grid-area: right; }
    #game-over {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,0,0,.85);
      padding: 24px 36px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid #f0f;
    }
    #game-over h2 { color: #f00; margin-bottom: 12px; }
    #game-over button {
      width: auto; height: auto; padding: 10px 24px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="score">Score : 0</div>
  <canvas id="c" width="320" height="320"></canvas>
  <div id="controls">
    <button id="btn-up">↑</button>
    <button id="btn-left">←</button>
    <button id="btn-down">↓</button>
    <button id="btn-right">→</button>
  </div>
  <div id="game-over">
    <h2>💀 Game Over</h2>
    <p id="final-score"></p>
    <br>
    <button id="btn-restart">Rejouer</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    const GRID = 20;
    const CELL = canvas.width / GRID;
    let snake, dir, food, score, loop;

    function init() {
      snake = [{x:10,y:10}];
      dir = {x:1,y:0};
      score = 0;
      scoreEl.textContent = 'Score : 0';
      gameOverEl.style.display = 'none';
      spawnFood();
      clearInterval(loop);
      loop = setInterval(tick, 150);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    function tick() {
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      head.x = (head.x + GRID) % GRID;
      head.y = (head.y + GRID) % GRID;

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'Score : ' + score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
      }

      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-2, 0, Math.PI*2);
      ctx.fill();

      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#0ff' : '#0f3460';
        ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
      });
    }

    function endGame() {
      clearInterval(loop);
      finalScoreEl.textContent = 'Score final : ' + score;
      gameOverEl.style.display = 'block';
    }

    function setDir(x, y) {
      if (dir.x === -x && dir.y === -y) return;
      dir = {x, y};
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp')    setDir(0,-1);
      else if (e.key === 'ArrowDown')  setDir(0, 1);
      else if (e.key === 'ArrowLeft')  setDir(-1,0);
      else if (e.key === 'ArrowRight') setDir(1, 0);
    });

    document.getElementById('btn-up').addEventListener('click', () => setDir(0,-1));
    document.getElementById('btn-down').addEventListener('click', () => setDir(0,1));
    document.getElementById('btn-left').addEventListener('click', () => setDir(-1,0));
    document.getElementById('btn-right').addEventListener('click', () => setDir(1,0));

    let tx, ty;
    canvas.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20) setDir(1,0); else if (dx < -20) setDir(-1,0);
      } else {
        if (dy > 20) setDir(0,1); else if (dy < -20) setDir(0,-1);
      }
    });

    document.getElementById('btn-restart').addEventListener('click', init);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('SW enregistré:', reg.scope))
        .catch(err => console.error('Erreur SW:', err));
    }

    init();
  </script>
</body>
</html>
